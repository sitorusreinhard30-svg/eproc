<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype Harga Zonasi HET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Nunito+Sans:wght@400;600&amp;family=Poppins:wght@700&amp;display=swap">
<style>
html,body{margin:0;height:100%;background:#1F2632;overflow:hidden}
a{color:#2B50C8}a:hover{color:#1f3a94}
input::placeholder{color:#A8ADB7}
#stage{position:absolute;top:0;left:0;width:1440px;height:1024px;transform-origin:0 0}
#switch{position:fixed;left:16px;bottom:16px;z-index:999;display:flex;gap:4px;padding:4px;border-radius:9999px;background:rgba(255,255,255,.92);box-shadow:0 4px 20px rgba(0,0,0,.25);font:600 12px/18px 'Open Sans',sans-serif}
#switch a{padding:6px 12px;border-radius:9999px;color:#344054;text-decoration:none}
#switch a[aria-current="page"]{background:#D22B50;color:#fff}
#noscript{color:#fff;font:14px 'Open Sans',sans-serif;padding:24px}
</style>
</head>
<body>
<div id="stage"></div>
<nav id="switch" aria-label="Pilih alternatif prototype">
<a id="sw1" href="?alt=1">Alt. 1 · Edit di popup</a>
<a id="sw2" href="?alt=2">Alt. 2 · Popup baca-saja</a>
</nav>
<noscript><p id="noscript">Prototype ini membutuhkan JavaScript.</p></noscript>

<template id="tpl">
<div style="position: relative; width: 1440px; height: 1024px; overflow: hidden; background: #FFFFFF; font-family: 'Open Sans', system-ui, sans-serif; color: #344054;">

<header style="height: 92px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #E2E4E8; background: #FFFFFF;">
<div style="flex-grow: 1; display: flex; align-items: center; gap: 6px;">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #D22B50; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v11H4z"></path><path d="M9 20v-6h6v6"></path></svg></span>
<div style="display: flex; flex-direction: column; line-height: 1;">
<span style="font-size: 15px; font-weight: 700; color: #D22B50; letter-spacing: -0.3px;">INAPROC</span>
<span style="font-size: 7px; color: #818996;">Manajemen Penyedia</span>
</div>
</div>
<button aria-label="Notifikasi, 1 baru" style="position: relative; width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #344054; cursor: pointer;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 0; right: 2px; min-width: 20px; height: 20px; box-sizing: border-box; border: 1px solid #FFFFFF; border-radius: 32px; background: #D22B50; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">1</span></button>
<button aria-label="Pesan" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #344054; cursor: pointer;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></button>
<span aria-hidden="true" style="width: 1px; height: 32px; background: #E2E4E8;"></span>
<button style="height: 44px; padding: 0; border: none; background: transparent; display: flex; align-items: center; gap: 8px; font-family: 'Nunito Sans', 'Open Sans', sans-serif; font-size: 16px; font-weight: 600; color: #344054; cursor: pointer;"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 9999px; background: #EAEDF9; color: #2B50C8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">TJ</span>Toko Jaya Sekali<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</header>

<sc-if value="{{isZonasi}}" hint-placeholder-val="{{ true }}">
<main style="height: 859px; overflow-y: auto; box-sizing: border-box; padding: 24px 134px 48px 134px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; align-items: flex-start; gap: 24px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700;">Atur Harga Zonasi</h1>
<p style="margin: 0; font-size: 14px; line-height: 21px;">Kisaran harga untuk zona wilayah tertentu. Reseller bisa menggunakan ini sebagai patokan harga pasar. Harga zonasi di luar pajak.</p>
</div>
<button onClick="{{openBulk}}" style="height: 40px; padding: 0 12px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 400; color: #344054; white-space: nowrap; cursor: pointer;">Atur Harga Zonasi Sekaligus</button>
</div>

<sc-if value="{{showBanner}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="padding: 16px; border: 1px solid #F04438; border-left-width: 4px; border-radius: 4px; background: #FFFAFA; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 21px;">
<strong style="font-size: 16px; line-height: 24px;">{{openAll}} lokasi belum memenuhi kriteria Harga Eceran Tertinggi (HET) dari Kemendikdasmen</strong>
<span>Sesuaikan harga produk sesuai HET zonasinya agar transaksi dapat diproses. <button onClick="{{openTinjau}}" style="padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #2B50C8; cursor: pointer;">Tinjau Harga Zonasi</button></span>
</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px;"><span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border: 1px solid #A8ADB7; border-radius: 4px; background: #FFFFFF;"></span>{{selectAllLabel}}</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start;">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 24px;">
<sc-for list="{{col.groups}}" as="g" hint-placeholder-count="3">
<section style="border: 1px solid #E2E4E8; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; gap: 10px;">
<span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border: 1px solid {{g.cbBorder}}; border-radius: 4px; background: {{g.cbBg}}; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
<strong style="flex-grow: 1; font-size: 14px; line-height: 20px;">{{g.prov}}</strong>
<button onClick="{{g.toggle}}" aria-expanded="{{g.expanded}}" aria-label="Tampilkan kota/kabupaten {{g.prov}}" style="width: 32px; height: 32px; border: none; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #344054; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{g.chevron}}deg);"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: 232px minmax(0, 1fr) 232px; gap: 8px 0; align-items: center; font-size: 14px;">
<span style="font-weight: 600;">Harga Produk</span><span></span><span style="font-weight: 600;">Harga Setelah Pajak</span>
<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid #E2E4E8; border-radius: 8px; overflow: hidden; background: #FFFFFF;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><span style="padding: 0 12px; color: #A8ADB7;">{{g.provPrice}}</span></div>
<span style="text-align: center;">=</span>
<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid #818996; border-radius: 8px; overflow: hidden; background: #F5F6F9;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><span style="padding: 0 12px; color: #818996;">{{g.provTax}}</span></div>
</div>
<sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
<div style="border-top: 1px solid #E2E4E8; padding: 24px 0 0 32px; display: flex; flex-direction: column; gap: 24px;">
<sc-for list="{{g.rows}}" as="k" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
<div style="display: flex; align-items: center; gap: 8px; font-weight: 700; line-height: 20px;"><span aria-hidden="true" style="width: 24px; height: 24px; box-sizing: border-box; border: 1px solid #FFFFFF; border-radius: 4px; background: #2B50C8; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>{{k.kab}}<span style="position: relative; display: inline-flex;"><button onMouseEnter="{{k.showTip}}" onMouseLeave="{{k.hideTip}}" onFocus="{{k.showTip}}" onBlur="{{k.hideTip}}" onClick="{{k.toggleTip}}" aria-describedby="tip-{{k.id}}" style="height: 24px; padding: 0 8px; border: none; border-radius: 4px; background: #F5F6F9; display: inline-flex; align-items: center; font-family: inherit; font-size: 12px; line-height: 18px; font-weight: 600; color: #344054; cursor: help;">{{k.zone}}</button><sc-if value="{{k.tipOpen}}" hint-placeholder-val="{{ false }}"><span role="tooltip" id="tip-{{k.id}}" style="position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 20; width: 340px; display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15)) drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.1));"><span style="width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; background: #344054; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px; font-weight: 400;"><span style="font-size: 14px; line-height: 20px;">Cakupan {{k.zone}}</span><span style="font-size: 12px; line-height: 18px;">Wilayah ini masuk {{k.zone}} sesuai ketentuan pembagian kriteria Harga Eceran Tertinggi (HET) dari Kemendikdasmen.</span></span><svg width="16" height="6" viewBox="0 0 16 6" aria-hidden="true"><path d="M0 0h16L8 6z" fill="#344054"></path></svg></span></sc-if></span></div>
<div style="display: grid; grid-template-columns: 232px minmax(0, 1fr) 232px; gap: 8px 0; align-items: center;">
<span style="font-weight: 600;">Harga Produk</span><span></span><span style="font-weight: 600;">Harga Setelah Pajak</span>
<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid {{k.border}}; border-radius: 8px; overflow: hidden; background: #FFFFFF;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><input inputmode="numeric" aria-label="Harga produk {{k.kab}}" value="{{k.priceText}}" onChange="{{k.onChange}}" style="flex-grow: 1; min-width: 0; height: 100%; padding: 0 12px; border: none; outline: none; font-family: inherit; font-size: 14px; color: #344054;"></div>
<span style="text-align: center;">=</span>
<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid #818996; border-radius: 8px; overflow: hidden; background: #F5F6F9;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><span style="padding: 0 12px; color: #818996;">{{k.taxText}}</span></div>
</div>
<span style="font-size: 12px; line-height: 18px; color: {{k.helperColor}};">{{k.helper}}</span>
</div>
</sc-for>
</div>
</sc-if>
</section>
</sc-for>
</div>
</sc-for>
</div>
</main>
<footer style="height: 73px; box-sizing: border-box; padding: 16px 135px; display: flex; justify-content: flex-end; gap: 16px; background: #FFFFFF; box-shadow: 0 2px 10px 0 #0000001a, 0 0 2px 0 #00000033;">
<button onClick="{{goProduk}}" style="width: 160px; height: 40px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #344054; cursor: pointer;">Kembali</button>
<button onClick="{{savePage}}" style="height: 40px; padding: 0 12px; border: 1px solid #D22B50; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #D22B50; cursor: pointer;">Simpan &amp; Tambah Produk Lagi</button>
<button onClick="{{savePage}}" style="width: 160px; height: 40px; border: none; border-radius: 8px; background: #D22B50; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer;">Simpan</button>
</footer>
</sc-if>

<sc-if value="{{isProduk}}" hint-placeholder-val="{{ false }}">
<main style="height: 859px; overflow-y: auto; box-sizing: border-box; padding: 24px 135px 48px 135px; display: flex; flex-direction: column; gap: 24px;">
<section style="padding: 24px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 48px; align-items: center;">
<div style="display: flex; flex-direction: column; gap: 4px;"><strong style="font-size: 16px;">Varian</strong><span style="font-size: 12px; color: #818996;">Tambah varian untuk produk dengan berbagai jenis</span></div>
<button style="justify-self: start; height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: #F5F6F9; font-family: inherit; font-size: 14px; font-weight: 600; color: #2B50C8; cursor: pointer;">+ Tambah Varian</button>
</section>
<section style="padding: 24px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px;">
<h2 style="margin: 0; padding-bottom: 16px; border-bottom: 1px solid #E2E4E8; font-size: 18px; font-weight: 700;">Harga</h2>
<div style="display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px 48px; align-items: start; font-size: 14px;">
<strong style="padding-top: 10px; font-size: 16px;">Minimum Pembelian</strong>
<input aria-label="Minimum pembelian" value="1" style="width: 232px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #A8ADB7; border-radius: 8px; font-family: inherit; font-size: 14px; color: #344054;">
<div style="display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 8px;"><strong style="font-size: 16px;">Harga Satuan</strong><span style="padding: 0 6px; border-radius: 4px; background: #F5F6F9; font-size: 12px; color: #818996;">Wajib</span></span><span style="font-size: 12px; color: #818996;">Harga ini diluar pajak dan ongkos kirim.</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; align-items: center; gap: 16px;"><div style="width: 232px; height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid #A8ADB7; border-radius: 8px; overflow: hidden;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><input aria-label="Harga satuan" placeholder="Harga" style="flex-grow: 1; min-width: 0; height: 100%; padding: 0 12px; border: none; outline: none; font-family: inherit; font-size: 14px;"></div><span>=</span><div style="width: 232px; height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid #818996; border-radius: 8px; overflow: hidden; background: #F5F6F9;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><span style="padding: 0 12px; color: #818996;">0</span></div></div><span style="padding-left: 280px; font-size: 12px; color: #818996;">Harga tayang termasuk pajak</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><strong style="font-size: 16px;">Harga Grosir</strong><span style="font-size: 12px; color: #818996;">Tambah harga grosir untuk pembelian jumlah tertentu. Harga ini diluar pajak dan ongkos kirim.</span></div>
<button style="justify-self: start; height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: #F5F6F9; font-family: inherit; font-size: 14px; font-weight: 600; color: #2B50C8; cursor: pointer;">+ Tambah Harga Grosir</button>
<div style="display: flex; flex-direction: column; gap: 4px;"><strong style="font-size: 16px;">Harga Zonasi</strong><span style="font-size: 12px; color: #818996;">Kisaran harga untuk zona wilayah tertentu. Reseller bisa menggunakan ini sebagai patokan harga pasar. Harga zonasi termasuk ongkos kirim di luar pajak.</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px;"><span aria-hidden="true" style="width: 32px; height: 18px; border-radius: 9999px; background: #2B50C8; position: relative;"><span style="position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 9999px; background: #FFFFFF;"></span></span>Aktif</span>
<button onClick="{{goZonasi}}" style="height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: #F5F6F9; font-family: inherit; font-size: 14px; font-weight: 600; color: #2B50C8; cursor: pointer;">Atur Harga Zonasi</button>
<sc-if value="{{savedOk}}" hint-placeholder-val="{{ false }}">
<div role="status" style="align-self: stretch; padding: 12px 16px; border: 1px solid #039855; border-left-width: 4px; border-radius: 4px; background: #F6FEF9; display: flex; align-items: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#039855"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Harga zonasi sudah diatur</div>
</sc-if>
</div>
</div>
</section>
<section style="padding: 24px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px;">
<h2 style="margin: 0; padding-bottom: 16px; border-bottom: 1px solid #E2E4E8; font-size: 18px; font-weight: 700;">Informasi Stok</h2>
<div style="display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px 48px; align-items: center; font-size: 14px;">
<span style="display: flex; align-items: center; gap: 8px;"><strong style="font-size: 16px;">Jumlah Stok</strong><span style="padding: 0 6px; border-radius: 4px; background: #F5F6F9; font-size: 12px; color: #818996;">Wajib</span></span>
<input aria-label="Jumlah stok" placeholder="Masukkan jumlah stok" style="width: 232px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E2E4E8; border-radius: 8px; font-family: inherit; font-size: 14px;">
<span style="display: flex; align-items: center; gap: 8px;"><strong style="font-size: 16px;">Satuan Barang</strong><span style="padding: 0 6px; border-radius: 4px; background: #F5F6F9; font-size: 12px; color: #818996;">Wajib</span></span>
<button style="width: 232px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 14px; color: #A8ADB7; cursor: pointer;">Pilih satuan barang<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</section>
</main>
<footer style="height: 73px; box-sizing: border-box; padding: 16px 135px; display: flex; justify-content: flex-end; gap: 16px; background: #FFFFFF; box-shadow: 0 2px 10px 0 #0000001a, 0 0 2px 0 #00000033;">
<button style="width: 160px; height: 40px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #344054; cursor: pointer;">Batal</button>
<button style="height: 40px; padding: 0 12px; border: 1px solid #D22B50; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #D22B50; cursor: pointer;">Simpan &amp; Lanjutkan Nanti</button>
<button style="height: 40px; padding: 0 12px; border: 1px solid #D22B50; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #D22B50; cursor: pointer;">Simpan &amp; Tambah Baru</button>
<button style="width: 160px; height: 40px; border: none; border-radius: 8px; background: #D22B50; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer;">Simpan</button>
</footer>
</sc-if>

<sc-if value="{{showOverlay}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(31, 38, 50, 0.6); display: flex; align-items: center; justify-content: center;">

<sc-if value="{{isBulk}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-labelledby="judul-bulk" style="width: 800px; box-sizing: border-box; padding: 24px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 8px 40px 0 #00000033, 0 0 4px 0 #0000001a; display: flex; flex-direction: column; gap: 16px;">

<span>Unduh Format</span>
<span aria-hidden="true" style="width: 190px; height: 2px; background: {{stepLine}};"></span>
<span aria-hidden="true" style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 9999px; border: 2px solid {{step2Ring}}; display: flex; align-items: center; justify-content: center; font-family: Poppins, 'Open Sans', sans-serif; font-size: 14px;">2</span>

<sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
<div style="padding: 16px; border: 1px solid #E2E4E8; border-radius: 8px; display: flex; align-items: center; gap: 16px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"><strong style="font-size: 16px; line-height: 24px;">Template dokumen pengaturan ongkir sekaligus</strong><span style="font-size: 12px; color: #818996;">Unduh dokumen excel untuk mengatur harga zonasi secara sekaligus berdasarkan lokasi.</span></div>
<button onClick="{{downloadTemplate}}" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 8px; background: #F5F6F9; font-family: inherit; font-size: 14px; font-weight: 600; color: #2B50C8; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg>Unduh Template</button>
</div>
<div style="padding: 16px; border: 1px solid #2E90FA; border-left-width: 4px; border-radius: 4px; background: #F5FAFF; display: flex; gap: 12px; font-size: 14px; line-height: 21px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E90FA" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>Gunakan Harga Eceran Tertinggi (HET) sebagai batas maksimal saat mengisi kolom harga produk di dokumen atur harga zonasi. Besarnya HET berbeda di setiap zona sesuai HPP dan biaya distribusi produk kemendikdasmen.</span>
</div>
<div style="border: 1px solid #A8ADB7; overflow: hidden;">
<div style="display: grid; grid-template-columns: 90px minmax(0, 1fr) 230px; height: 56px; align-items: center; background: #F5F6F9; font-size: 14px; font-weight: 700;"><span style="padding: 0 16px;">Zona</span><span style="padding: 0 16px;">Cakupan Provinsi</span><span style="padding: 0 16px;">Harga Eceran Tertinggi (HET)</span></div>
<div style="height: 234px; overflow-y: auto;">
<sc-for list="{{zoneInfo}}" as="z" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 90px minmax(0, 1fr) 230px; min-height: 56px; align-items: center; background: {{z.zebra}}; font-size: 14px; line-height: 21px;"><strong style="padding: 8px 16px;">{{z.label}}</strong><span style="padding: 8px 16px;">{{z.cov}}</span><strong style="padding: 8px 16px;">Maksimal {{z.het}}</strong></div>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 16px; padding-top: 8px;">
<button onClick="{{closeModal}}" style="flex: 1; height: 40px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #344054; cursor: pointer;">Batal</button>
<button onClick="{{toStep2}}" style="flex: 1; height: 40px; border: none; border-radius: 8px; background: #D22B50; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer;">Selanjutnya</button>
</div>
</sc-if>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 14px; line-height: 21px;">
<p style="margin: 0;">Mohon pastikan hal berikut:</p>
<ul style="margin: 0; padding-left: 20px;">
<li>Gunakan template resmi yang telah disediakan.</li>
<li>Simpan dokumen dalam format .xlsx.</li>
<li>Pertahankan kolom dan struktur sesuai aslinya, tanpa diubah.</li>
<li>Isi data harga per wilayah dengan benar.</li>
<li>Batasi ukuran dokumen maksimal 50 MB.</li>
<li>Kosongkan kolom provinsi jika data sudah diisi di kolom Kota/Kabupaten, karena data provinsi akan diabaikan.</li>
</ul>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<strong style="font-size: 14px; font-weight: 600;">{{uploadLabel}}</strong>
<sc-if value="{{upIdle}}" hint-placeholder-val="{{ true }}">
<div style="padding: 24px 16px; border: 1px dashed #CED2D8; border-radius: 8px; background: #FAFBFB; display: flex; align-items: center; gap: 16px;">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 9999px; background: #EFF8FF; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#2E90FA"><path d="M17.5 19H7a5 5 0 0 1-.9-9.92A6.5 6.5 0 0 1 18.6 8.6 5.2 5.2 0 0 1 17.5 19z"></path><path d="M12 16v-5M9.5 13.5L12 11l2.5 2.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;"><strong style="font-size: 14px; font-weight: 600;">Pilih atau tarik dokumen di sini</strong><span style="font-size: 12px; color: #818996;">XLX (max. 50Mb)</span></div>
<button onClick="{{startUpload}}" style="height: 32px; padding: 0 8px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; color: #344054; cursor: pointer;">Unggah dokumen</button>
</div>
</sc-if>
<sc-if value="{{upLoading}}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px; border: 1px solid #E2E4E8; border-radius: 8px; display: flex; gap: 16px;">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9999px; background: #EFF8FF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#2E90FA"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<strong style="font-size: 14px; font-weight: 600;">Harga Zonasi.xlsx.</strong>
<div style="display: flex; align-items: center;"><span style="flex-grow: 1; font-size: 12px; color: #818996;">16 MB</span><button onClick="{{cancelUpload}}" style="padding: 0; border: none; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #D22B50; cursor: pointer;">Batalkan</button></div>
<div style="display: flex; align-items: center; gap: 16px;"><div role="progressbar" aria-label="Progres unggah" aria-valuenow="{{progress}}" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; height: 6px; border-radius: 9999px; background: #E2E4E8; overflow: hidden;"><div style="height: 100%; width: {{progress}}%; background: #F79009;"></div></div><span style="font-size: 12px; color: #818996;">{{progress}}%</span></div>
</div>
</div>
</sc-if>
<sc-if value="{{upDone}}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px; border: 1px solid #E2E4E8; border-radius: 8px; display: flex; gap: 16px;">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9999px; background: #EFF8FF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#2E90FA"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<strong style="font-size: 14px; font-weight: 600;">Harga Zonasi.xlsx.</strong>
<div style="display: flex; align-items: center;"><span style="flex-grow: 1; font-size: 12px; color: #818996;">16 MB</span><button onClick="{{removeFile}}" style="padding: 0; border: none; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; color: #D22B50; cursor: pointer;">Hapus</button></div>
<button onClick="{{startUpload}}" style="align-self: flex-start; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #2B50C8; cursor: pointer;">Ulangi unggah Berkas</button>
</div>
</div>
</sc-if>
<sc-if value="{{upError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="padding: 16px; border: 1px solid #F04438; border-radius: 8px; background: #FFFAFA; display: flex; gap: 16px;">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9999px; background: #FEF3F2; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#F04438"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<strong style="font-size: 14px; font-weight: 600;">{{upErrorText}}</strong>
<span style="font-size: 12px; color: #818996;">Harga Zonasi.xlsx.</span>
<button onClick="{{startUpload}}" style="align-self: flex-start; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #2B50C8; cursor: pointer;">Ulangi unggah Berkas</button>
</div>
</div>
</sc-if>
</div>
<div style="display: flex; gap: 16px; padding-top: 8px;">
<button onClick="{{toStep1}}" style="flex: 1; height: 40px; border: 1px solid #E2E4E8; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #344054; cursor: pointer;">Kembali</button>
<button onClick="{{saveUpload}}" style="flex: 1; height: 40px; border: none; border-radius: 8px; background: #D22B50; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer;">Simpan</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isTinjau}}" hint-placeholder-val="{{ true }}">
<div role="dialog" aria-modal="true" aria-labelledby="judul-tinjau" style="position: relative; width: 947px; height: {{modalH}}; background: #FFFFFF; border-radius: 8px; box-shadow: 0 8px 40px 0 rgba(0, 0, 0, 0.2), 0 0 4px 0 rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden;">
<div style="padding: 24px 24px 8px 24px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; gap: 10px;">

<button onClick="{{closeModal}}" aria-label="Tutup" style="width: 32px; height: 32px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #344054; cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #818996;">Daftar lokasi berikut memiliki harga produk yang melebihi HET.</p>
</div>

<div style="flex: 1; min-height: 0; padding: 0 16px 8px 16px; display: flex; flex-direction: column; gap: 16px;">
<div role="tablist" aria-label="Zona" style="height: 56px; flex-shrink: 0; display: flex; gap: 12px; border-bottom: 1px solid #E2E4E8;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
<button role="tab" aria-selected="{{t.selected}}" onClick="{{t.select}}" style="height: 56px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: none; border-bottom: 4px solid {{t.line}}; background: transparent; font-family: inherit; font-size: 16px; line-height: 24px; font-weight: {{t.weight}}; color: {{t.color}}; white-space: nowrap; cursor: pointer;">{{t.text}}<sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; padding: 0 6px; box-sizing: border-box; border: 1px solid #FFFFFF; border-radius: 32px; background: #D22B50; color: #FFFFFF; font-size: 14px; line-height: 21px; font-weight: 600; text-align: center;">{{t.count}}</span></sc-if></button>
</sc-for>
</div>

<sc-if value="{{tabAll}}" hint-placeholder-val="{{ true }}">
<div style="flex-shrink: 0; padding: 16px; border: 1px solid {{calloutBorder}}; border-left-width: {{calloutLeft}}; border-radius: 4px; background: {{calloutBg}}; font-size: 14px; line-height: 20px;">Gunakan Harga Eceran Tertinggi (HET) sebagai batas maksimal saat merevisi harga produk. Besarnya HET berbeda di setiap zona sesuai HPP dan biaya distribusi produk kemendikdasmen. <sc-if value="{{isAlt1}}" hint-placeholder-val="{{ true }}">Anda juga dapat revisi menggunakan fitur <button onClick="{{openBulk}}" style="padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 700; color: #2B50C8; cursor: pointer;">Atur Harga Zonasi Sekaligus</button></sc-if><sc-if value="{{isAlt2}}" hint-placeholder-val="{{ false }}">Revisi Lebih mudah dengan fitur "Atur Harga Zonasi Sekaligus".</sc-if></div>
<div style="flex-shrink: 0;">
<button onClick="{{toggleAcc}}" aria-expanded="{{accExpanded}}" style="width: 100%; padding: 16px; display: flex; align-items: center; border: none; border-bottom: 1px solid #E2E4E8; background: #FFFFFF; font-family: inherit; font-size: 16px; line-height: 24px; font-weight: 600; color: #344054; text-align: left; cursor: pointer;"><span style="flex-grow: 1;">{{accLabel}}</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{accChevron}}deg);"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{accOpen}}" hint-placeholder-val="{{ false }}">
<div style="margin: 0 16px 16px 16px; border: 1px solid #A8ADB7; max-height: 197px; overflow-y: auto;">
<div style="position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 160px minmax(0, 1fr) 300px; height: 52px; align-items: center; background: #F5F6F9; font-size: 14px; font-weight: 700;"><span style="padding: 0 14px;">Zona</span><span style="padding: 0 14px;">Cakupan Provinsi</span><span style="padding: 0 14px;">Harga Eceran Tertinggi (HET)</span></div>
<sc-for list="{{zoneInfo}}" as="z" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 160px minmax(0, 1fr) 300px; min-height: 52px; align-items: center; background: {{z.zebra}}; font-size: 14px; line-height: 20px;"><strong style="padding: 8px 14px;">{{z.label}}</strong><span style="padding: 8px 14px;">{{z.cov}}</span><strong style="padding: 8px 14px;">Maksimal {{z.het}}</strong></div>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{tabZone}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; flex-shrink: 0; padding: 16px; border: 1px solid {{calloutBorder}}; border-left-width: {{calloutLeft}}; border-radius: 4px; background: {{calloutBg}}; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 20px;">
<div style="display: flex; align-items: center;"><strong style="flex-grow: 1; font-size: 16px; line-height: 24px;">HET {{zoneLabel}} : Maksimal {{zoneHet}}</strong>
<button onClick="{{toggleTipZone}}" onMouseEnter="{{showTipZone}}" onMouseLeave="{{hideTip}}" aria-label="Cakupan provinsi {{zoneLabel}}" style="width: 24px; height: 24px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #344054; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"></path></svg></button></div>
<sc-if value="{{tipZone}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; bottom: calc(100% - 44px); right: 44px; z-index: 5; width: 360px; box-sizing: border-box; padding: 12px; border-radius: 8px; background: #344054; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);"><span style="font-size: 14px; line-height: 20px;">Cakupan Provinsi {{zoneLabel}}</span><span style="font-size: 12px; line-height: 18px;">{{zoneCov}}</span></span></sc-if>
<span>Gunakan Harga Eceran Tertinggi (HET) sebagai batas maksimal saat merevisi harga produk. Besarnya HET berbeda di setiap zona sesuai HPP dan biaya distribusi produk kemendikdasmen. <sc-if value="{{isAlt1}}" hint-placeholder-val="{{ true }}">Anda juga dapat revisi menggunakan fitur <button onClick="{{openBulk}}" style="padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 700; color: #2B50C8; cursor: pointer;">Atur Harga Zonasi Sekaligus</button></sc-if><sc-if value="{{isAlt2}}" hint-placeholder-val="{{ false }}">Revisi Lebih mudah dengan fitur "Atur Harga Zonasi Sekaligus".</sc-if></span>
</div>
</sc-if>

<div style="flex: 1; min-height: 120px; display: flex; flex-direction: column; border: 1px solid #A8ADB7;">
<div style="position: relative; flex-shrink: 0; display: grid; grid-template-columns: {{cols}}; min-height: 56px; align-items: center; background: #F5F6F9; border-bottom: 1px solid #E2E4E8; font-size: 14px; line-height: 21px; font-weight: 700;">
<span style="padding: 8px 16px; text-align: center;">No</span>
<sc-if value="{{tabAll}}" hint-placeholder-val="{{ true }}"><button onClick="{{sortZona}}" aria-label="Urutkan berdasarkan zona" style="padding: 8px 16px; border: none; background: transparent; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054; cursor: pointer;">Zona<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button></sc-if>
<button onClick="{{sortProv}}" aria-label="Urutkan berdasarkan provinsi" style="padding: 8px 16px; border: none; background: transparent; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 14px; font-weight: 700; color: #344054; cursor: pointer;">Provinsi<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button>
<span style="padding: 8px 16px;">Kota/Kabupaten</span>
<span style="padding: 8px 16px; display: flex; align-items: center; gap: 8px;">{{priceHeader}}<button onClick="{{toggleTipPrice}}" onMouseEnter="{{showTipPrice}}" onMouseLeave="{{hideTip}}" aria-label="Keterangan harga produk" style="width: 20px; height: 20px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #344054; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"></path></svg></button></span>
<span style="padding: 8px 16px;">Maks. HET</span>
<span style="padding: 8px 16px;">Status</span>
<sc-if value="{{tipPrice}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; top: -32px; left: {{tipPriceLeft}}; z-index: 5; padding: 8px 12px; border-radius: 8px; background: #344054; color: #FFFFFF; font-size: 12px; line-height: 18px; font-weight: 400; white-space: nowrap;">Harga Produk sebelum Pajak</span></sc-if>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: {{cols}}; min-height: 59px; align-items: center; background: {{r.zebra}}; font-size: 14px; line-height: 21px;">
<span style="padding: 8px 16px; text-align: center;">{{r.no}}</span>
<sc-if value="{{tabAll}}" hint-placeholder-val="{{ true }}"><span style="padding: 8px 16px;">{{r.zone}}</span></sc-if>
<span style="padding: 8px 16px;">{{r.prov}}</span>
<span style="padding: 8px 16px;">{{r.kab}}</span>
<sc-if value="{{isAlt1}}" hint-placeholder-val="{{ true }}">
<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;">
<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid {{r.border}}; border-radius: 8px; overflow: hidden; background: #FFFFFF;"><span style="height: 100%; padding: 0 8px; display: flex; align-items: center; background: #E2E4E8; font-size: 12px; font-weight: 600; color: #818996;">Rp</span><input inputmode="numeric" aria-label="Harga produk {{r.kab}}" value="{{r.priceText}}" onChange="{{r.onChange}}" style="flex-grow: 1; min-width: 0; height: 100%; padding: 0 12px; border: none; outline: none; font-family: inherit; font-size: 14px; color: #344054; background: transparent;"></div>
<sc-if value="{{r.showErr}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 18px; color: #F04438;">Melebihi batas HET (Maks. {{r.het}})</span></sc-if>
</div>
</sc-if>
